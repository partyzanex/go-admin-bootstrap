services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goadmin
      POSTGRES_PASSWORD: goadmin
      POSTGRES_DB: goadmin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goadmin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
